name: Integration - Startup Ordering

on:
  pull_request:
    branches: [ main ]

jobs:
  integration-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build images (deps only)
        run: |
          docker-compose -f deployment/aws/docker-compose.yml build postgres redis

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run startup-order integration test
        working-directory: backend
        run: npx jest tests/integration/startup-order.test.js --runInBand --detectOpenHandles

      - name: Tear down compose (always)
        if: always()
        run: |
          docker-compose -f deployment/aws/docker-compose.yml down --remove-orphans --volumes
